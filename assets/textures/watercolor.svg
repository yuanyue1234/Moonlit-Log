<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="watercolor">
      <feTurbulence type="turbulence" baseFrequency="0.02" numOctaves="3" seed="5" stitchTiles="stitch"/>
      <feDisplacementMap in="SourceGraphic" scale="20"/>
      <feGaussianBlur stdDeviation="2"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.08"/>
      </feComponentTransfer>
    </filter>
    <radialGradient id="wc-spot1" cx="30%" cy="40%" r="25%">
      <stop offset="0%" stop-color="#8B7355" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8B7355" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wc-spot2" cx="70%" cy="60%" r="20%">
      <stop offset="0%" stop-color="#8B7355" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#8B7355" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wc-spot3" cx="50%" cy="20%" r="18%">
      <stop offset="0%" stop-color="#8B7355" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#8B7355" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="256" height="256" fill="url(#wc-spot1)"/>
  <rect width="256" height="256" fill="url(#wc-spot2)"/>
  <rect width="256" height="256" fill="url(#wc-spot3)"/>
  <rect width="256" height="256" filter="url(#watercolor)"/>
</svg>
