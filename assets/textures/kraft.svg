<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="kraft-noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.12"/>
      </feComponentTransfer>
    </filter>
    <pattern id="kraft-fibers" x="0" y="0" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="none"/>
      <path d="M0 2h12v0.5H0z" fill="#8B7355" opacity="0.06"/>
      <path d="M2 0v12h0.5V0z" fill="#8B7355" opacity="0.04"/>
      <path d="M6 0v12h0.3V0z" fill="#8B7355" opacity="0.05"/>
      <path d="M0 6h12v0.3H0z" fill="#8B7355" opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="256" height="256" filter="url(#kraft-noise)"/>
  <rect width="256" height="256" fill="url(#kraft-fibers)"/>
</svg>
